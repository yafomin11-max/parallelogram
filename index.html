<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARALLELOGRAM</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#ecebe8;--ink:#0b0b0b;--white:#fff;--mute:#76736d;--line:#d4d2cd;--edge:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--paper:#121211;--ink:#f2f1ee;--white:#262624;--mute:#9a978f;--line:#3a3a37;--edge:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:500 17px/1.3 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;letter-spacing:.04em}
#app{display:flex;height:100%}
#side{width:340px;border-right:1px solid var(--line);display:flex;flex-direction:column}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
.logo{display:block;width:calc(100% - 28px);max-width:312px;height:auto;margin:14px 14px 6px;filter:drop-shadow(2px 0 0 var(--edge)) drop-shadow(-2px 0 0 var(--edge)) drop-shadow(0 2px 0 var(--edge)) drop-shadow(0 -2px 0 var(--edge))}
.bar{display:flex;gap:8px;padding:8px 12px;align-items:center}
.bar h2{margin:0;flex:1;font-size:24px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=text]{font:inherit;font-size:18px;color:var(--ink);background:var(--white);border:0;border-bottom:2px solid var(--ink);padding:9px 12px;outline:none;min-width:0;border-radius:0;flex:1;width:100%}
.btn,.item.on,.item.on:hover,.m.me .b{position:relative;isolation:isolate;background:var(--edge);color:#fff}
.btn::before,.item.on::before,.m.me .b::before{content:"";position:absolute;inset:2px;background:#000;z-index:-1}
.btn::before{clip-path:polygon(18% 0,100% 0,82% 100%,0 100%)}
.item.on::before{clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
.m.me .b::before{clip-path:polygon(0 0,97% 0,100% 100%,3% 100%)}
.btn{font:inherit;font-weight:700;border:0;cursor:pointer;clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);padding:10px 26px;text-transform:uppercase;letter-spacing:.1em;flex:none}
.btn.off{background:var(--line);color:var(--ink)}
.btn.off::before{background:var(--white)}
.btn:disabled{opacity:.4}
#list{flex:1;overflow-y:auto;padding:4px 10px}
.item{cursor:pointer;padding:14px 22px;margin:5px 0;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);background:var(--white);text-transform:uppercase;font-size:20px;letter-spacing:.08em;display:flex;gap:8px}
.item i{font-style:normal;color:var(--ink);font-size:18px;align-self:center}
.item:hover{background:var(--line)}
#msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;align-self:flex-start;display:flex;gap:8px;align-items:flex-end}
.m.me{align-self:flex-end}
.col{min-width:0}
.who{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;padding-left:14px}
.m.me .who{text-align:right;padding-right:14px}
.b{background:var(--white);padding:9px 22px;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);white-space:pre-wrap;word-wrap:break-word;font-size:19px;letter-spacing:.03em}
.m.me .b{clip-path:polygon(0 0,97% 0,100% 100%,3% 100%)}
.b small{display:block;font-size:12px;opacity:.55;text-align:right}
.av{width:34px;height:34px;flex:none;background:var(--edge);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-weight:700}
.av img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:cover;clip-path:polygon(18% 0,100% 0,82% 100%,0 100%)}
.av.big{width:84px;height:84px;font-size:32px}
#form{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:center}
.empty{margin:auto;color:var(--mute);text-align:center;text-transform:uppercase;letter-spacing:.14em;padding:20px}
#back{display:none;padding:10px 20px}
#note{padding:6px 14px;color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
.panel{background:var(--paper);border:2px solid var(--edge);width:100%;max-width:420px;max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:26px;text-transform:uppercase;letter-spacing:.12em}
.panel label{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;display:block}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:6;background:#000;color:#fff;border:2px solid var(--edge);padding:10px 18px;display:none;max-width:80%;text-transform:uppercase;letter-spacing:.06em}
.item{align-items:center}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nm,.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font-size:14px;color:var(--mute);text-transform:none;letter-spacing:.02em}
.item.on .pv{color:#bbb}
#found{padding:0 10px}
#typing{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;min-height:15px;padding:0 12px}
#rbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);color:var(--mute)}
#rbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt{font-size:14px;opacity:.7;border-left:2px solid currentColor;padding-left:8px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;gap:6px;padding:3px 14px;font-size:15px}
.rx span{background:var(--white);padding:0 8px}
.act{display:flex;gap:4px;padding:4px 10px}
.act button{font:inherit;font-size:18px;background:var(--white);color:var(--ink);border:1px solid var(--line);padding:2px 10px;cursor:pointer}
.b{cursor:pointer}
#login{position:fixed;inset:0;z-index:9;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px}
@media(max-width:700px){
#side{width:100%}
#chat{display:none}
#app.open #side{display:none}
#app.open #chat{display:flex}
#back{display:block}
}
</style>
<style id="pg-pro-v3-css">
/* PARALLELOGRAM PRO v3 additions — isolated styles */
#pgProDock{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
#pgProDock button{min-width:38px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;cursor:pointer}
#pgProDock button:hover{filter:brightness(1.12)}
#pgProMenu{position:fixed;z-index:9999;right:18px;bottom:74px;width:min(360px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px #0008;padding:14px;display:none}
#pgProMenu.open{display:block}
#pgProMenu h3{margin:0 0 12px}
.pgGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgGrid button,.pgRow button{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px;border-radius:10px;cursor:pointer}
.pgRow{display:flex;gap:8px;align-items:center;margin:8px 0}.pgRow>*:first-child{flex:1}
#pgSearchBox{position:fixed;z-index:9998;top:12%;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;box-shadow:0 18px 60px #0008}
#pgSearchBox.open{display:block}#pgSearchBox input{width:100%;box-sizing:border-box}.pgResults{max-height:48vh;overflow:auto;margin-top:10px}.pgResult{padding:9px;border-bottom:1px solid var(--line);cursor:pointer}.pgResult:hover{background:var(--bg)}
#pgAttach{display:none}.pgMedia{max-width:min(420px,70vw);max-height:420px;border-radius:12px;display:block;margin-top:4px}.pgAudio{max-width:min(360px,70vw)}
.pgPinned{border-left:3px solid var(--accent);padding-left:8px}.pgDraft{font-size:11px;color:var(--mute);margin-left:auto}
@media(max-width:700px){#pgProMenu{bottom:125px}.pgGrid{grid-template-columns:1fr}}
</style>
</head>

 addMember:(id,u)=>updateDoc(doc(db,"chats",id),{members:arrayUnion(u)}),
 msgs:(id,cb)=>onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("t","desc"),limit(300)),s=>cb(s.docs.map(withId).reverse()),e=>note("Ошибка чтения: "+e.code)),
 addMsg:(id,m)=>addDoc(collection(db,"chats",id,"messages"),m),
 editMsg:(id,mid,p)=>updateDoc(doc(db,"chats",id,"messages",mid),p),
 delMsg:(id,mid)=>deleteDoc(doc(db,"chats",id,"messages",mid)),
 profiles:cb=>onSnapshot(collection(db,"users"),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o)},()=>{}),
 saveProfile:(id,p)=>setDoc(doc(db,"users",id),Object.assign({nameLower:(p.name||"").toLowerCase()},p),{merge:true}),
 search:async q=>{q=q.toLowerCase();return Object.keys(P).filter(i=>{const p=P[i];return (p.name||"").toLowerCase().includes(q)||(p.username||"").includes(q)}).map(i=>({id:i,name:P[i].name}))},
 names:async()=>({}),
 typing:c=>updateDoc(doc(db,"chats",c),{["ty_"+uid]:Date.now()}).catch(()=>{})
};
/* ===== помощники ===== */
const nameOf=u=>(P[u]&&P[u].name)||names[u]||"Аноним";
const cur=()=>chats.find(c=>c.id===active);
const visible=c=>!c.dm||c.dm.includes(uid);
const otherOf=c=>c.dm.find(x=>x!==uid)||uid;
const title=c=>c.dm?(c.dm[0]===c.dm[1]?"★ Избранное":nameOf(otherOf(c))):(c.name||"Без названия");
const unreadFor=c=>c.lastUid&&c.lastUid!==uid&&(c.t||0)>(c["r_"+uid]||0);
function avatar(u){
 const a=el("div","av"),p=P[u];
 if(p&&p.avatar){const i=el("img");i.src=p.avatar;a.appendChild(i)}else a.textContent=nameOf(u)[0].toUpperCase();
 return a;
}
async function resolve(ids){
 ids=[...new Set(ids.filter(i=>i&&i!==uid&&!names[i]&&!(P[i]&&P[i].name)))];
 return;
 try{const ps=await Store.names(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||"Аноним");renderList();renderMsgs(true)}catch(e){}
}
/* ===== список чатов ===== */
function renderList(){
 const L=$("list"),q=$("q").value.toLowerCase();L.innerHTML="";
 chats.filter(visible).filter(c=>title(c).toLowerCase().includes(q)).forEach(c=>{
  const i=el("div","item"+(c.id===active?" on":"")),tx=el("div","tx");i.dataset.chatId=c.id;
  tx.append(el("span","nm",title(c)),el("span","pv",c.lastText||""));i.appendChild(tx);
  if(unreadFor(c)&&c.id!==active)i.appendChild(el("i","","●"));
  i.onclick=()=>openChat(c.id);L.appendChild(i);
 });
 if(!L.children.length)L.appendChild(el("div","empty","Чатов нет. Нажмите «+ Новый»"));
}
function markRead(){
 const c=cur();
 if(c&&unreadFor(c)&&!document.hidden)Store.updateChat(c.id,{["r_"+uid]:Math.max(Date.now(),c.t||0)}).catch(()=>{});
}
function openChat(id){
 active=id;window.__pgActiveChat=id;sel=null;replyTo=null;editing=null;typers={};$("app").classList.add("open");
 if(unsub)unsub();msgs=[];renderList();renderBars();renderMsgs();markRead();
 unsub=Store.msgs(id,l=>{msgs=l;renderMsgs();resolve(l.map(m=>m.uid))});
}
/* ===== сообщения ===== */
function renderMsgs(keep){
 const M=$("msgs"),top=M.scrollTop;M.innerHTML="";
 const c=cur();
 if(!c){M.appendChild(el("div","empty","Выберите чат"));$("form").style.display="none";$("title").textContent="";$("addm").style.display="none";return}
 $("form").style.display="flex";$("title").textContent=title(c);$("addm").style.display=c.dm?"none":"block";
 if(!msgs.length)M.appendChild(el("div","empty","Здесь пока тихо. Напишите первым"));
 const oR=c.dm?(c["r_"+otherOf(c)]||0):0;
 msgs.forEach(m=>{
  const me=m.uid===uid,w=el("div","m"+(me?" me":"")),col=el("div","col");w.dataset.msgId=m.id;
  if(!me)w.appendChild(avatar(m.uid));
  const p=P[m.uid];
  col.appendChild(el("div","who",me?"Вы":nameOf(m.uid)+(p&&p.username?" @"+p.username:"")));
  const b=el("div","b");
  if(m.reply){const r=el("div","qt");r.textContent="↩ "+nameOf(m.reply.uid)+": "+m.reply.text;b.appendChild(r)}
  b.appendChild(el("span","",m.text));
  b.appendChild(el("small","",fmt(m.t)+(m.edited?" · изм.":"")+(me&&c.dm?(oR>=m.t||c.dm[0]===c.dm[1]?" ✓✓":" ✓"):"")));
  b.onclick=()=>{sel=sel===m.id?null:m.id;renderMsgs(true)};
  col.appendChild(b);
  const rx={};Object.keys(m).forEach(k=>{if(k.startsWith("rx_")&&m[k])rx[m[k]]=(rx[m[k]]||0)+1});
  if(Object.keys(rx).length){const r=el("div","rx");Object.keys(rx).forEach(e=>r.appendChild(el("span","",e+" "+rx[e])));col.appendChild(r)}
  if(sel===m.id){
   const a=el("div","act");
   const add=(l,f)=>{const x=el("button","",l);x.onclick=ev=>{ev.stopPropagation();f()};a.appendChild(x)};
   add("↩",()=>{replyTo=m;editing=null;sel=null;renderBars();renderMsgs(true);$("text").focus()});
   ["👍","❤️","😂"].forEach(e=>add(e,()=>{sel=null;Store.editMsg(active,m.id,{["rx_"+uid]:m["rx_"+uid]===e?"":e}).catch(()=>{})}));
   if(me){add("✎",()=>{editing=m.id;replyTo=null;sel=null;$("text").value=m.text;renderBars();renderMsgs(true);$("text").focus()});
    add("🗑",()=>{sel=null;Store.delMsg(active,m.id).catch(()=>{})})}
   col.appendChild(a);
  }
  w.appendChild(col);M.appendChild(w);
 });
 M.scrollTop=keep?top:1e9;
}
function renderBars(){
 const r=$("rbar");
 if(replyTo){r.style.display="flex";r.firstChild.textContent="↩ "+nameOf(replyTo.uid)+": "+replyTo.text.slice(0,60)}
 else if(editing){r.style.display="flex";r.firstChild.textContent="✎ Редактирование"}
 else r.style.display="none";
}
$("rx").onclick=()=>{replyTo=null;if(editing)$("text").value="";editing=null;renderBars()};
async function send(){
 const v=$("text").value.trim(),c=cur();if(!v||!c||!db)return;
 $("text").value="";
 try{
  if(editing){await Store.editMsg(active,editing,{text:v,edited:true});editing=null}
  else{
   const m={uid,text:v,t:Date.now()};
   if(replyTo)m.reply={id:replyTo.id,uid:replyTo.uid,text:replyTo.text.slice(0,80)};
   await Store.addMsg(active,m);
   Store.updateChat(active,{t:m.t,lastText:v.slice(0,60),lastUid:uid,["r_"+uid]:m.t}).catch(()=>{});
  }
  replyTo=null;renderBars();
 }catch(e){note("Не удалось отправить ("+e.code+"). Нужны права «Contributor»");$("text").value=v}
}
/* ===== новый чат / люди ===== */
let st;
async function findPeople(){
 const q=$("newname").value.trim(),F=$("found");F.innerHTML="";
 const fav=el("div","item",""),tx=el("div","tx");tx.appendChild(el("span","nm","★ Избранное"));fav.appendChild(tx);fav.onclick=()=>openDM(uid);F.appendChild(fav);
 if(q.length<2)return;
 try{
  const r=await Store.search(q);
  r.filter(p=>p.id!==uid).slice(0,6).forEach(p=>{
   names[p.id]=p.name||names[p.id]||"Аноним";
   const i=el("div","item"),t=el("div","tx");t.append(el("span","nm",p.name||"Аноним"),el("span","pv","Написать лично"));i.appendChild(t);i.onclick=()=>openDM(p.id);F.appendChild(i);
  });
 }catch(e){}
}

 try{if(!chats.find(c=>c.id===id))await Store.createChat({dm:[uid,other],t:Date.now()},id)}catch(e){note("Не удалось создать чат ("+e.code+")");return}

}

 try{const id=await Store.createChat({name:n,by:uid,t:Date.now()});$("newname").value="";$("newrow").style.display="none";$("found").innerHTML="";openChat(id)}

let tt;
function toast(x){const t=$("toast");t.textContent=x;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3500)}
function incoming(c){

 if(!S.notif||here)return;
 const t=title(c)+(c.dm?"":" · "+nameOf(c.lastUid));
 try{if(document.hidden&&window.Notification&&Notification.permission==="granted"){new Notification(t,{body:c.lastText||""});return}}catch(e){}

}
function showTyping(){
 const now=Date.now(),c=cur(),ns=c?(c.members||[]).filter(u=>u!==uid&&now-(c["ty_"+u]||0)<3500).map(nameOf):[];
 $("typing").textContent=ns.length?ns.join(", ")+" печатает…":"";

setInterval(showTyping,1000);
$("text").oninput=()=>{const n=Date.now();if(active&&n-lastTyp>2500){lastTyp=n;Store.typing(active)}};
$("text").onkeydown=e=>{if(e.key==="Enter")send()};
$("send").onclick=send;
$("back").onclick=()=>{$("app").classList.remove("open");active=null;window.__pgActiveChat=null;if(unsub)unsub();renderList();renderMsgs()};
document.addEventListener("visibilitychange",markRead);
/* ===== настройки ===== */
const avatarDraft=()=>draftAv!==null?draftAv:((P[uid]&&P[uid].avatar)||"");
function paintSettings(){
 $("tdark").classList.toggle("off",S.theme!=="dark");$("tlight").classList.toggle("off",S.theme!=="light");
 $("pnotif").textContent=S.notif?"Вкл":"Выкл";$("pnotif").classList.toggle("off",!S.notif);
}
function paintAv(){const a=avatarDraft();$("pav").innerHTML="";$("pav").textContent="";if(a){const i=el("img");i.src=a;$("pav").appendChild(i)}else $("pav").textContent=(($("pname").value||"?")[0]).toUpperCase()}
$("gear").onclick=()=>{const p=P[uid]||{};$("pname").value=p.name||"";$("puser").value=p.username||"";draftAv=null;paintSettings();paintAv();$("modal").style.display="flex"};
$("cancel").onclick=()=>$("modal").style.display="none";
$("tdark").onclick=()=>{S.theme="dark";applyTheme();saveS();paintSettings()};
$("tlight").onclick=()=>{S.theme="light";applyTheme();saveS();paintSettings()};
$("pnotif").onclick=async()=>{
 if(!S.notif){S.notif=true;try{if(window.Notification&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}}else S.notif=false;
 saveS();paintSettings();
};
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement("canvas");c.width=c.height=96;const x=c.getContext("2d"),s=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);draftAv=c.toDataURL("image/jpeg",.8);paintAv()};im.src=r.result};
 r.readAsDataURL(f);
};
$("pname").oninput=()=>{if(!avatarDraft())paintAv()};
$("save").onclick=async()=>{
 if(!db||!uid){$("modal").style.display="none";return}
 const prof={name:$("pname").value.trim().slice(0,30),username:$("puser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20),avatar:avatarDraft(),t:Date.now()};
 try{await Store.saveProfile(uid,prof);toast("Сохранено")}catch(e){note("Не удалось сохранить ("+e.code+")")}
 $("modal").style.display="none";
};
/* ===== вход и запуск ===== */
$("login").querySelector("img").src=document.querySelector(".logo").src;
$("gbtn").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("lerr").textContent="Ошибка входа: "+e.code);
$("logout").onclick=()=>{$("modal").style.display="none";signOut(auth)};
$("addm").onclick=async()=>{
 const c=cur();if(!c||c.dm)return;const n=(prompt("Юзернейм друга (без @):")||"").trim().toLowerCase();if(!n)return;
 const id=Object.keys(P).find(i=>(P[i].username||"")===n);
 if(!id){toast("Не найден: @"+n);return}
 try{await Store.addMember(c.id,id);toast("Добавлен: "+nameOf(id))}catch(e){note("Не удалось добавить ("+e.code+")")}
};
let started=false,unsubs=[];
renderList();renderMsgs();
onAuthStateChanged(auth,async u=>{
 if(!u){unsubs.forEach(f=>f());unsubs=[];started=false;uid=null;chats=[];prev=null;active=null;P={};renderList();renderMsgs();$("login").style.display="flex";return}
 $("login").style.display="none";if(started)return;started=true;uid=u.uid;let first=true;
 unsubs.push(Store.profiles(o=>{P=o;
  if(first){first=false;if(!P[uid])Store.saveProfile(uid,{name:u.displayName||"Аноним",username:"",avatar:u.photoURL||"",t:Date.now()}).catch(()=>{})}
  renderList();renderMsgs(true)}));
 unsubs.push(Store.chats(l=>{
  if(prev)l.forEach(c=>{const o=prev[c.id];if(visible(c)&&o&&(c.t||0)>(o.t||0)&&c.lastUid&&c.lastUid!==uid)incoming(c)});
  prev={};l.forEach(c=>prev[c.id]=c);chats=l;
  renderList();if(active)renderMsgs(true);markRead();
 }));
});

function addToolbar(){const form=$("form");if(!form||$("pgProDock"))return;const dock=document.createElement("div");dock.id="pgProDock";dock.innerHTML='<button id="pgEmoji" title="Эмодзи">😊</button><button id="pgImage" title="Изображение">🖼️</button><button id="pgVoice" title="Голосовое">🎤</button><button id="pgMore" title="PRO">⚡</button>';form.parentNode.insertBefore(dock,form.nextSibling);$("pgMore").onclick=openMenu;$("pgEmoji").onclick=()=>{$("text").value+=" 😊";$ ("text").focus()};$("pgImage").onclick=()=>$("pgAttach").click();$("pgAttach").onchange=e=>{const f=e.target.files?.[0];if(f)sendImage(f);e.target.value=""};$("pgVoice").onclick=recordVoice}
let recorder=null,chunks=[];async function recordVoice(){if(recorder&&recorder.state==="recording"){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>650000){toast("Голосовое слишком длинное");return}const id=active(),u=auth.currentUser;if(!id||!u)return;const fr=new FileReader();fr.onload=async()=>{try{const m={uid:u.uid,t:Date.now(),text:"",audio:fr.result};await addDoc(collection(db,"chats",id,"messages"),m);await updateDoc(doc(db,"chats",id),{t:m.t,lastText:"🎤 Голосовое сообщение",lastUid:u.uid,["r_"+u.uid]:m.t});toast("Голосовое отправлено")}catch(e){toast("Не удалось отправить голосовое")}};fr.readAsDataURL(blob)};recorder.start();toast("Запись… нажми 🎤 ещё раз для остановки")}catch(e){toast("Нет доступа к микрофону")}}
function renderMedia(messages){const root=$("msgs");if(!root)return;messages.forEach(m=>{const w=root.querySelector(`[data-msg-id="${CSS.escape(m.id)}"]`);if(!w)return;const b=w.querySelector(".b");if(!b)return;if(m.image&&!b.querySelector(".pgMedia")){const im=document.createElement("img");im.className="pgMedia";im.src=m.image;im.alt="Изображение";b.insertBefore(im,b.firstChild)}if(m.audio&&!b.querySelector(".pgAudio")){const au=document.createElement("audio");au.className="pgAudio";au.controls=true;au.src=m.audio;b.insertBefore(au,b.firstChild)}})}
function watchCurrent(){let last=null;setInterval(async()=>{const id=active();if(!id||id===last)return;last=id;try{onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("t","asc"),limit(300)),s=>renderMedia(s.docs.map(d=>({id:d.id,...d.data()}))))}catch(e){}},700)}
function addMessageSearchUI(){const x=$("pgSearchResults");x.addEventListener("click",e=>{const r=e.target.closest(".pgResult");if(!r||!r.dataset.mid)return;const m=$("msgs").querySelector(`[data-msg-id="${CSS.escape(r.dataset.mid)}"]`);if(m){m.scrollIntoView({behavior:"smooth",block:"center"});m.classList.add("pgPinned");setTimeout(()=>m.classList.remove("pgPinned"),1600)}$("pgSearchBox").classList.remove("open")})}
function setup(){injectTheme();apply();addToolbar();addMediaToMessages();watchCurrent();addMessageSearchUI();
 $("pgClose").onclick=closeMenu;$("pgTheme").onchange=e=>{st.theme=e.target.value;apply()};$("pgFont").oninput=e=>{st.font=+e.target.value;apply()};$("pgSearch").onclick=openSearch;$("pgExport").onclick=exportChat;
 $("pgArchive").onclick=()=>{const id=active();if(!id){toast("Сначала открой чат");return}if(st.archived.includes(id))st.archived=st.archived.filter(x=>x!==id);else st.archived.push(id);save();toast(st.archived.includes(id)?"Чат отправлен в архив":"Чат возвращён из архива")};
 $("pgPin").onclick=()=>{const id=active();if(!id){toast("Сначала открой чат");return}if(st.pinned.includes(id))st.pinned=st.pinned.filter(x=>x!==id);else st.pinned.unshift(id);save();toast(st.pinned.includes(id)?"Чат закреплён":"Чат откреплён")};
 $("pgNotif").onclick=()=>{const id=active();if(!id){toast("Сначала открой чат");return}if(st.muted.includes(id))st.muted=st.muted.filter(x=>x!==id);else st.muted.push(id);save();toast(st.muted.includes(id)?"Уведомления выключены":"Уведомления включены")};
 $("pgCompact").onclick=()=>{st.compact=!st.compact;apply();toast(st.compact?"Компактный режим включён":"Компактный режим выключен")};$("pgClearDraft").onclick=()=>{const id=active();if(id)delete st.drafts[id];save();$("text").value="";toast("Черновик очищен")};$("text").addEventListener("input",saveDraft);$("text").addEventListener("keydown",()=>setTimeout(saveDraft,0));
 document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("pgSearchBox").classList.remove("open");closeMenu()}if(e.ctrlKey&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus()}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="f"){e.preventDefault();openSearch()}});
 const obs=new MutationObserver(()=>{loadDraft();});obs.observe($("msgs"),{childList:true});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",setup,{once:true});else setup();
</script>
</body>
</html>
